<style>
:root{
--surface-canvas:#0b0c0e;--surface-sunken:#060708;--surface-raised:#131519;--surface-overlay:#1a1d23;
--surface-inset:#101318;--surface-hover:#1f232a;--surface-active:#262b33;--surface-disabled:#15181d;
--surface-scrim:rgba(4,5,7,0.74);
--line-hairline:#1c2026;--line-default:#2a2f37;--line-strong:#3d444f;--border-control:#6b7482;--focus-ring:#ff9a6b;
--text-primary:#f4f1ec;--text-secondary:#b9bec7;--text-tertiary:#949ba7;--text-disabled:#5d646f;--text-inverse:#0b0c0e;
--text-brand:#ff8a5c;--text-accent:#58e8bf;--text-brass:#e6c979;
--brand:#ff6a2b;--brand-hover:#ff804a;--brand-soft:#2a1409;--on-brand:#180a03;
--accent:#35e0b0;--accent-hover:#5aeac3;--accent-soft:#07221c;--on-accent:#04130f;
--brass:#d9b45a;--brass-soft:#241c0c;--on-brass:#1a1405;
--success:#3ad07f;--success-soft:#06231a;--text-success:#66dd9f;--on-success:#04170f;
--warning:#f5b53c;--warning-soft:#241a06;--text-warning:#f7c869;--on-warning:#1c1301;
--danger:#ff5d5d;--danger-soft:#2a0d0f;--text-danger:#ff8585;--on-danger:#1e0505;
--info:#48b6ef;--info-soft:#06202c;--text-info:#79ccf5;--on-info:#03151e;
--viz-1:#ff6a2b;--viz-2:#35e0b0;--viz-3:#d9b45a;--viz-4:#48b6ef;
--viz-5:#ff8fc0;--viz-6:#a9d84a;--viz-7:#9b8cff;--viz-8:#c98a62;
--font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
--font-sans:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
--font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
--radius-xs:3px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--radius-2xl:36px;
--radius-pill:999px;
--ease-standard:cubic-bezier(0.2,0,0,1);--ease-entrance:cubic-bezier(0.16,1,0.3,1);
--ease-exit:cubic-bezier(0.7,0,0.84,0);--ease-spring:cubic-bezier(0.34,1.56,0.64,1);
--ease-anticipate:cubic-bezier(0.68,-0.4,0.27,1.4);
--d-instant:80ms;--d-fast:140ms;--d-base:220ms;--d-slow:380ms;--d-slower:620ms;--d-cine:1100ms;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-canvas);color:var(--text-primary);
font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--text-brand);text-decoration:none}
a:hover{color:var(--brand-hover)}
::selection{background:rgba(255,106,43,0.34)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:2px}
button,input,select,textarea{font-family:inherit}
.fl-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.fl-mono{font-family:var(--font-mono)}
.fl-overline{font:700 11px/1.2 var(--font-sans);letter-spacing:.14em;color:var(--text-tertiary);margin:0}
.fl-rule{height:1px;background:var(--line-hairline);border:0;margin:0;width:100%}

.fl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;
padding:0 16px;border-radius:var(--radius-md);border:1px solid transparent;
font:600 14px/1.2 var(--font-sans);cursor:pointer;text-decoration:none;white-space:nowrap;
transition:background var(--d-instant) var(--ease-standard),
border-color var(--d-instant) var(--ease-standard),
box-shadow var(--d-base) var(--ease-standard),transform var(--d-instant) var(--ease-standard)}
.fl-btn:active{transform:translateY(1px)}
.fl-btn[data-size="sm"]{height:30px;padding:0 12px;font-size:12px;border-radius:var(--radius-sm)}
.fl-btn[data-size="lg"]{height:46px;padding:0 22px;font-size:16px}
.fl-btn[data-variant="primary"]{background:var(--brand);color:var(--on-brand)}
.fl-btn[data-variant="primary"]:hover{background:var(--brand-hover);
box-shadow:0 0 0 1px rgba(255,106,43,.5),0 12px 40px rgba(255,106,43,.28)}
.fl-btn[data-variant="secondary"]{background:var(--surface-raised);color:var(--text-primary);
border-color:var(--line-strong)}
.fl-btn[data-variant="secondary"]:hover{background:var(--surface-hover);border-color:var(--border-control)}
.fl-btn[data-variant="ghost"]{background:transparent;color:var(--text-secondary)}
.fl-btn[data-variant="ghost"]:hover{background:var(--surface-hover);color:var(--text-primary)}
.fl-btn[data-variant="danger"]{background:var(--danger);color:var(--on-danger)}
.fl-btn[data-variant="danger"]:hover{background:#ff7676}
.fl-btn[data-variant="accent"]{background:var(--accent);color:var(--on-accent)}
.fl-btn[data-variant="accent"]:hover{background:var(--accent-hover)}
.fl-btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

.fl-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
min-width:38px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;
color:var(--text-secondary);cursor:pointer;
transition:background var(--d-instant) var(--ease-standard),color var(--d-instant) var(--ease-standard)}
.fl-icon-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
.fl-icon-btn[data-shape="circle"]{border-radius:var(--radius-circle,50%)}
.fl-icon-btn[data-variant="outline"]{border-color:var(--line-default)}

.fl-badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;
border-radius:var(--radius-pill);font:700 12px/1 var(--font-sans);border:1px solid transparent;
white-space:nowrap}
.fl-badge[data-tone="brand"]{background:var(--brand-soft);color:var(--text-brand)}
.fl-badge[data-tone="accent"]{background:var(--accent-soft);color:var(--text-accent)}
.fl-badge[data-tone="success"]{background:var(--success-soft);color:var(--text-success)}
.fl-badge[data-tone="warning"]{background:var(--warning-soft);color:var(--text-warning)}
.fl-badge[data-tone="danger"]{background:var(--danger-soft);color:var(--text-danger)}
.fl-badge[data-tone="info"]{background:var(--info-soft);color:var(--text-info)}
.fl-badge[data-tone="brass"]{background:var(--brass-soft);color:var(--text-brass)}
.fl-badge[data-tone="neutral"]{background:var(--surface-active);color:var(--text-secondary)}
.fl-badge[data-variant="outline"]{background:transparent;border-color:var(--line-strong);
color:var(--text-secondary)}
.fl-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.fl-card{background:var(--surface-raised);border:1px solid var(--line-default);
border-radius:var(--radius-md);padding:24px;
transition:border-color var(--d-base) var(--ease-standard),
box-shadow var(--d-base) var(--ease-standard),transform var(--d-base) var(--ease-standard)}
.fl-card[data-interactive="true"]:hover{border-color:var(--line-strong);
box-shadow:0 10px 24px rgba(0,0,0,.55);transform:translateY(-2px)}

.fl-input{height:38px;width:100%;background:var(--surface-inset);
border:1px solid var(--border-control);border-radius:var(--radius-sm);color:var(--text-primary);
padding:0 12px;font:400 14px/1.2 var(--font-sans);
transition:border-color var(--d-fast) var(--ease-standard)}
.fl-input::placeholder{color:var(--text-tertiary)}
.fl-input:hover{border-color:#8a929e}
.fl-input[aria-invalid="true"]{border-color:var(--danger)}
.fl-label{display:block;font:600 14px/1.2 var(--font-sans);color:var(--text-secondary);
margin-bottom:8px}
.fl-help{font:400 12px/1.5 var(--font-sans);color:var(--text-tertiary);margin:6px 0 0}
.fl-error{font:400 12px/1.5 var(--font-sans);color:var(--text-danger);margin:6px 0 0}

.fl-table{width:100%;border-collapse:collapse;font:400 14px/1.55 var(--font-sans)}
.fl-table th{text-align:left;font:700 12px/1.2 var(--font-sans);color:var(--text-tertiary);
padding:10px 12px;border-bottom:1px solid var(--line-default);background:var(--surface-raised);
white-space:nowrap}
.fl-table td{padding:12px;border-bottom:1px solid var(--line-hairline);color:var(--text-secondary);
vertical-align:middle}
.fl-table td[data-numeric="true"],.fl-table th[data-numeric="true"]{text-align:right;
font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.fl-table tbody tr{transition:background var(--d-instant) var(--ease-standard);cursor:default}
.fl-table tbody tr:hover{background:var(--surface-hover)}
.fl-table tbody tr[aria-selected="true"]{background:var(--brand-soft)}
.fl-table__sort{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;
display:inline-flex;align-items:center;gap:6px}
.fl-table__sort:hover{color:var(--text-primary)}

.fl-tab{background:none;border:0;padding:0 2px 12px;color:var(--text-tertiary);
font:600 14px/1.2 var(--font-sans);cursor:pointer;position:relative;
transition:color var(--d-fast) var(--ease-standard)}
.fl-tab:hover{color:var(--text-secondary)}
.fl-tab[aria-selected="true"]{color:var(--text-primary)}
.fl-tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
height:2px;background:var(--brand)}

.fl-seg{display:inline-flex;background:var(--surface-inset);border:1px solid var(--line-default);
border-radius:var(--radius-sm);padding:3px;gap:2px}
.fl-seg button{background:none;border:0;height:26px;padding:0 12px;border-radius:4px;
color:var(--text-tertiary);font:600 12px/1 var(--font-sans);cursor:pointer;
transition:background var(--d-fast) var(--ease-standard),color var(--d-fast) var(--ease-standard)}
.fl-seg button:hover{color:var(--text-secondary)}
.fl-seg button[aria-pressed="true"]{background:var(--surface-active);color:var(--text-primary)}

.fl-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
border-radius:var(--radius-pill);border:1px solid var(--line-default);background:transparent;
color:var(--text-secondary);font:600 12px/1 var(--font-sans);cursor:pointer;
transition:all var(--d-fast) var(--ease-standard)}
.fl-chip:hover{border-color:var(--line-strong);color:var(--text-primary)}
.fl-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
color:var(--text-accent)}

.fl-navlink{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;
border-radius:var(--radius-sm);color:var(--text-tertiary);font:600 13px/1 var(--font-sans);
background:none;border:0;cursor:pointer;width:100%;text-align:left;
transition:background var(--d-fast) var(--ease-standard),color var(--d-fast) var(--ease-standard)}
.fl-navlink:hover{background:var(--surface-hover);color:var(--text-primary)}
.fl-navlink[aria-current="page"]{background:var(--surface-active);color:var(--text-primary)}
.fl-navlink[aria-current="page"] .fl-navlink__bar{opacity:1}
.fl-navlink__bar{width:2px;height:16px;background:var(--brand);border-radius:2px;opacity:0;flex:none}

.fl-switch{display:inline-flex;align-items:center;width:40px;height:22px;flex:none;
border-radius:var(--radius-pill);background:var(--surface-inset);
border:1px solid var(--border-control);padding:2px;cursor:pointer;
transition:background var(--d-fast) var(--ease-standard),
border-color var(--d-fast) var(--ease-standard)}
.fl-switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.fl-switch__knob{width:16px;height:16px;border-radius:50%;background:var(--text-secondary);
transition:transform var(--d-fast) var(--ease-spring),background var(--d-fast) var(--ease-standard)}
.fl-switch[aria-checked="true"] .fl-switch__knob{transform:translateX(18px);background:var(--on-accent)}

.fl-progress{height:6px;border-radius:var(--radius-pill);background:var(--surface-inset);
overflow:hidden;width:100%}
.fl-progress__fill{height:100%;background:var(--brand);border-radius:var(--radius-pill);
transition:width var(--d-slow) var(--ease-standard)}

.fl-kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;
background:var(--surface-inset);border:1px solid var(--line-default);color:var(--text-tertiary);
font:500 11px/1 var(--font-mono)}

@media (prefers-reduced-motion:reduce){
*{animation-duration:1ms !important;animation-iteration-count:1 !important;
transition-duration:1ms !important}
}
.node{cursor:pointer}
.node rect{transition:stroke 140ms var(--ease-standard),fill 140ms var(--ease-standard)}
.node:hover rect{stroke:#6b7482}
.legend-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-secondary)}
.insp-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-hairline)}
.insp-row:last-child{border-bottom:0}
@keyframes dash{to{stroke-dashoffset:-16}}
.flowing{stroke-dasharray:4 4;animation:dash 1.1s linear infinite}
</style>
